[project]
name = "hollowmere-app"
version = "1.0.0"
description = "Hollowmere Festival app: the line-up and your wristband (Lecture 7)"
requires-python = ">=3.12"
# Keep this in step with requirements.txt, which the Dockerfile uses.
dependencies = ["flask==3.1.3", "prometheus-client==0.26.0", "segno==1.6.6"]

# Tools for developing, not for running the app. The image never sees them.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
