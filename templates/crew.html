<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ fest }}: crew screen</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* The projector page: big enough to read from the back row. */
    main.crew { max-width: 1200px; display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: center; padding-top: 40px; }
    .qr { padding: 18px; border-radius: 24px; background: #fff; line-height: 0; }
    .qr svg { width: min(42vw, 520px); height: auto; }
    .crew .wordmark { font-size: 56px; }
    .crew h1.call { margin: 18px 0 6px; font-family: var(--display); font-size: 44px; text-transform: uppercase; }
    .crew .url { font-family: var(--mono); font-size: 24px; color: var(--muted); word-break: break-all; }
    .counts { display: flex; gap: 20px; margin: 28px 0 12px; }
    .count { padding: 18px 26px; border: 1px solid var(--card-line); border-radius: 20px; background: var(--card); }
    .count b { display: block; font-family: var(--display); font-size: 72px; line-height: 1; }
    .count span { color: var(--muted); font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; }
    .count.vip b { color: var(--gold-1); }
    .vips { display: flex; flex-wrap: wrap; gap: 10px; min-height: 48px; padding: 0; list-style: none; }
    .vips li { padding: 8px 16px; border-radius: 999px; font-family: var(--mono); font-size: 26px; font-weight: 700; color: #10091c; background: linear-gradient(120deg, var(--gold-1), var(--gold-2)); }
    @media (max-width: 800px) { main.crew { grid-template-columns: 1fr; } .qr svg { width: 100%; } }
  </style>
</head>
<body>
<main class="crew">
  <div class="qr" role="img" aria-label="QR code that opens {{ url }}">{{ qr | safe }}</div>
  <div>
    <p class="wordmark" id="fest">{{ fest }}</p>
    <h1 class="call">Scan for your wristband</h1>
    <p class="url">{{ url }}</p>
    <div class="counts" aria-live="polite">
      <p class="count"><b id="online">0</b><span>Phones online</span></p>
      <p class="count vip"><b id="vip-count">0</b><span>VIP</span></p>
      <p class="count"><b id="version">v{{ version }}</b><span>Live version</span></p>
    </div>
    <ul class="vips" id="vips" aria-label="VIP wristbands online"></ul>
  </div>
</main>
<script>
  // Ask the app who is online every 3 seconds (phones seen in the last 30 s).
  async function tick() {
    try {
      const reply = await fetch("/crew/stats", { cache: "no-store" });
      const data = await reply.json();
      document.getElementById("online").textContent = data.online;
      document.getElementById("vip-count").textContent = data.vip.length;
      document.getElementById("version").textContent = "v" + data.version;
      document.getElementById("fest").textContent = data.festival;
      document.getElementById("vips").replaceChildren(...data.vip.map((t) => {
        const li = document.createElement("li");
        li.textContent = "№ " + t;
        return li;
      }));
    } catch (error) { /* app restarting: try again next tick */ }
    setTimeout(tick, 3000);
  }
  tick();
</script>
</body>
</html>
