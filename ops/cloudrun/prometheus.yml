# Fallback H-B: Prometheus on the laptop watches the app on Cloud Run.
# Put your service's address (without https://) in targets, then:
#   docker compose -f compose.yaml -f cloudrun/compose.override.yaml up -d prometheus crowd
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hollowmere
    scheme: https
    static_configs:
      - targets: ["hollowmere-REPLACE-ME.a.run.app"]
